<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>三福生活新「搭」案</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .logo-container {
            margin-bottom: 20px;
        }

        .logo {
            width: 200px;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .title-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .main-title {
            font-size: 32px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .sub-title {
            font-size: 16px;
            color: #666;
        }

        .buttons-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 30px;
        }

        .game-button {
            width: 180px;
            height: 220px;
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: none;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .game-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.15);
        }

        .game-button img {
            width: 90%;
            height: 90%;
            object-fit: contain;
            border-radius: 16px;
        }

        .icon-wrapper {
            width: 90%;
            height: 90%;
            background: #ffffff;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .icon-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #ffffff;
            z-index: 1;
        }

        .icon-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            position: relative;
            z-index: 2;
        }

        .game-button:active {
            transform: translateY(-2px);
        }

        .slogan {
            font-size: 18px;
            color: #ff6b6b;
            text-align: center;
            margin-bottom: 40px;
            font-weight: 500;
        }

        .rules-link {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ff8e53 100%);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 500;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .rules-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
        }

        footer {
            margin-top: auto;
            padding: 20px;
            color: #999;
            font-size: 12px;
        }

        @media (max-width: 768px) {
            .buttons-container {
                flex-direction: column;
                align-items: center;
            }

            .game-button {
                width: 250px;
                height: 280px;
            }

            .main-title {
                font-size: 24px;
            }
        }

    </style>
</head>
<body>
    <div class="logo-container">
        <img src="../logo/sanfu.png" alt="三福LOGO" class="logo">
    </div>
    
    <div class="title-section">
        <h1 class="main-title">三福元气补给站</h1>
        <p class="sub-title">潮趣好搭子·生活样样搭</p>
    </div>
    
    <div class="buttons-container">
        <button class="game-button" onclick="saveStateAndNavigate('beauty.html')">
            <img src="../fengmiananniu/huazhuangpinshounaanniu.jpg" alt="美妆收纳">
        </button>
        <button class="game-button" onclick="saveStateAndNavigate('snack.html')">
            <img src="../fengmiananniu/lingshixiaoxiaoleanniu.jpg" alt="零食消消乐">
        </button>
    </div>
    
    <p class="slogan">✨美妆 + 零食 = 你的生活万能搭子✨</p>
    
    <a href="#rules" class="rules-link" onclick="showRules()">游戏规则</a>
    
    <footer>
        <p>三福生活 | 让生活更美好</p>
    </footer>

    <div id="rules-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;">
        <div style="background: white; padding: 30px; border-radius: 20px; max-width: 400px; max-height: 80vh; overflow-y: auto;">
            <h2 style="margin-bottom: 20px; color: #333;">游戏规则</h2>
            <ul style="list-style: none; color: #666; line-height: 1.8;">
                <li><strong>美妆收纳：</strong>将化妆品分类收纳到对应区域</li>
                <li><strong>零食消消乐：</strong>交换相邻零食，三个及以上相同零食消除</li>
            </ul>
            <button onclick="document.getElementById('rules-modal').style.display='none'" style="margin-top: 20px; padding: 10px 30px; background: #ff6b6b; color: white; border: none; border-radius: 20px; cursor: pointer;">关闭</button>
        </div>
    </div>

    <script>
        function showRules() {
            document.getElementById('rules-modal').style.display = 'flex';
        }

        function saveStateAndNavigate(url) {
            location.href = url;
        }
    </script>
</body>
</html>
